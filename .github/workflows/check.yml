name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check scripts
        run: |
          for f in scripts/*.js scripts/*.mjs; do
            node --check "$f"
          done

      - name: Check local references (pages and scripts)
        run: node scripts/check-links.mjs
