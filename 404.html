<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found – Jiří Mlčoušek</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0b0d">
    <link rel="icon" href="/Personal-page/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* GitHub Pages serves this file at any URL depth, so everything here is absolute or inline */
        :root { --bg: #0a0b0d; --ink: #f4f5f6; --muted: #9aa0a8; --accent: #fc5200; --accent-text: #ff7a3d; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif;
        }
        main { max-width: 520px; }
        .code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); }
        h1 { margin: 12px 0 14px; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; }
        p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
        a {
            display: inline-block; padding: 12px 20px; border-radius: 10px; background: var(--accent);
            color: #fff; font-weight: 600; text-decoration: none;
        }
        a:hover { background: #e04a00; }
        a:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <span class="code">Error 404</span>
        <h1>This page ran off course.</h1>
        <p>The address does not exist or has moved. The home page has everything: projects, CV, races and the blog.</p>
        <a href="/Personal-page/pages/index.html">Back to the home page</a>
    </main>
</body>
</html>
